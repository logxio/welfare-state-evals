[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "welfare-state-evals"
version = "0.1.3"
description = "Operational tool environments with exact state recomputation"
requires-python = ">=3.11"
authors = [{name = "Yan Su", email = "hi@yansu.me"}]
dependencies = []

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.289"]
test = ["pytest>=8"]

[project.entry-points.inspect_ai]
welfare_state_evals = "welfare_state_evals._registry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
welfare_state_evals = ["dataset.jsonl", "evidence.json", "cards/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
